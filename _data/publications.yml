- title: "A distributional model of concepts grounded in the spatial organization of objects"
  authors: "Andrea Gregor de Varda, Marco Petilli, Marco Marelli"
  venue: "Journal of Memory and Language, 142, 104624"
  year: 2025
  date: "2025-03"
  type: "journal"
  highlight: true
  thumb: "/assets/img/research/semantic_scape.png"
  url: "https://doi.org/10.1016/j.jml.2025.104624"
  pdf: "https://www.sciencedirect.com/science/article/pii/S0749596X25000178/pdfft"
  abstract: "Data-driven models of concepts are gaining popularity in Psychology and Cognitive Science. Distributional semantic models represent word meanings as abstract word co-occurrence patterns, and excel at capturing human meaning intuitions about conceptual relationships; however, they lack the explicit links to the physical world that humans acquire through perception. Computer vision neural networks, on the other hand, can produce representations of visually-grounded concepts, but they do not support the extraction of information about the relationships between objects. To bridge the gap between distributional semantic models and computer vision networks, we introduce SemanticScape, a model of semantic concepts grounded in the visual relationships between objects in natural images. The model captures the latent statistics of the spatial organization of objects in the visual environment. Its implementation is based on the calculation of the summed Euclidean distances between all object pairs in visual scenes, which are then abstracted by means of dimensionality reduction. We validate our model against human explicit intuitions on semantic and visual similarity, relatedness, analogical reasoning, and several semantic and visual implicit processing measurements. Our results show that SemanticScape explains variance in human responses in the semantic tasks above and beyond what can be accounted for by standard distributional semantic models and convolutional neural networks; however, it is not predictive of human performance in implicit perceptual tasks. Our findings highlight that implicit information about the objects' spatial distribution in the environment has a specific impact on semantic processing, demonstrating the importance of this often neglected experiential source."
- title: "Cracking arbitrariness: A data-driven study of auditory iconicity in spoken English"
  authors: "Andrea Gregor de Varda, Marco Marelli"
  venue: "Psychonomic Bulletin & Review, 32, 1425-1442"
  year: 2025
  date: "2025-01"
  type: "journal"
  url: "https://doi.org/10.3758/s13423-024-02630-0"
  pdf: "https://link.springer.com/content/pdf/10.3758/s13423-024-02630-0.pdf"
  abstract: "Auditory iconic words display a phonological profile that imitates their referents' sounds. Traditionally, those words are thought to constitute a minor portion of the auditory lexicon. In this article, we challenge this assumption by assessing the pervasiveness of onomatopoeia in the English auditory vocabulary through a novel data-driven procedure. We embed spoken words and natural sounds into a shared auditory space through (a) a short-time Fourier transform, (b) a convolutional neural network trained to classify sounds, and (c) a network trained on speech recognition. Then, we employ the obtained vector representations to measure their objective auditory resemblance. These similarity indexes show that imitation is not limited to some circumscribed semantic categories, but instead can be considered as a widespread mechanism underlying the structure of the English auditory vocabulary. We finally empirically validate our similarity indexes as measures of iconicity against human judgments."
- title: "The Italian Crowdsourcing Project: Visual word recognition times for 130,495 Italian words"
  authors: "Simona Amenta, Andrea Gregor de Varda, Pawel Mandera, Emmanuel Keuleers, Marc Brysbaert, Marco Marelli"
  venue: "Behavior Research Methods, 57(1), 26"
  year: 2025
  date: "2024-12"
  type: "journal"
  url: "https://doi.org/10.3758/s13428-024-02548-4"
  pdf: "https://link.springer.com/content/pdf/10.3758/s13428-024-02548-4.pdf"
  abstract: "Despite being largely spoken and studied by language and cognitive scientists, Italian lacks large resources of language processing data. The Italian Crowdsourcing Project (ICP) is a dataset of word recognition times and accuracy including responses to 130,465 words, which makes it the largest dataset of its kind item-wise. The data were collected in an online word knowledge task in which over 156,000 native speakers of Italian took part. We validated the ICP dataset by (1) showing that ICP reaction times correlate strongly (r = .78) with lexical decision latencies collected in a traditional lab experiment, (2) showing that the effect of major psycholinguistic variables (e.g., frequency, length, etc.) can be replicated in this dataset, and (3) replicating the effect of word prevalence, which we compute here for the first time for Italian. Given the inclusion of many inflectional forms of verbs, adjectives, and nouns, we further showcase the potential of this dataset by exploring two phenomena (inflectional entropy in verb paradigms and the clitic effect in isolated word recognition) that build on the peculiar properties of Italian. In this paper we present the ICP resource and release response times, accuracy, and prevalence estimates for all the words included."
- title: "Meaning Beyond Lexicality: Capturing Pseudoword Definitions with Language Models"
  authors: "Andrea Gregor de Varda, Daniele Gatti, Marco Marelli, Fritz Günther"
  venue: "Computational Linguistics, 50(4), 1313-1343"
  year: 2024
  date: "2024-12"
  type: "journal"
  url: "https://doi.org/10.1162/coli_a_00527"
  pdf: "https://aclanthology.org/2024.cl-4.4.pdf"
  abstract: "Pseudowords such as \"knackets\" or \"spechy\"—letter strings that are consistent with the orthotactical rules of a language but do not appear in its lexicon—are traditionally considered to be meaningless, and used as such in empirical studies. However, recent studies that show specific semantic patterns associated with these words as well as semantic effects on human pseudoword processing have cast doubt on this view. While these studies suggest that pseudowords have meanings, they provide only extremely limited insight as to whether humans are able to ascribe explicit and declarative semantic content to unfamiliar word forms. In the present study, we utilized an exploratory-confirmatory study design to examine this question. In a first exploratory study, we started from a pre-existing dataset of words and pseudowords alongside human-generated definitions for these items. Using 18 different language models, we showed that the definitions actually produced for (pseudo)words were closer to their respective (pseudo)words than the definitions for the other items. Based on these initial results, we conducted a second, pre-registered, high-powered confirmatory study collecting a new, controlled set of (pseudo)word interpretations. This second study confirmed the results of the first one. Taken together, these findings support the idea that meaning construction is supported by a flexible form-to-meaning mapping system based on statistical regularities in the language environment that can accommodate novel lexical entries as soon as they are encountered."
- title: "Cloze probability, predictability ratings, and computational estimates for 205 English sentences, aligned with existing EEG and reading time data"
  authors: "Andrea Gregor de Varda, Marco Marelli, Simona Amenta"
  venue: "Behavior Research Methods, 56(5), 5190-5213"
  year: 2024
  date: "2023-10"
  type: "journal"
  url: "https://doi.org/10.3758/s13428-023-02261-8"
  pdf: "https://link.springer.com/content/pdf/10.3758/s13428-023-02261-8.pdf"
  abstract: "We release a database of cloze probability values, predictability ratings, and computational estimates for a sample of 205 English sentences (1726 words), aligned with previously released word-by-word reading time data (both self-paced reading and eye-movement records; Frank et al., Behavior Research Methods, 45(4), 1182–1190. 2013) and EEG responses (Frank et al., Brain and Language, 140, 1–11. 2015). Our analyses show that predictability ratings are the best predictors of the EEG signal (N400, P600, LAN) self-paced reading times, and eye movement patterns, when spillover effects are taken into account. The computational estimates are particularly effective at explaining variance in the eye-tracking data without spillover. Cloze probability estimates have decent overall psychometric accuracy and are the best predictors of early fixation patterns (first fixation duration). Our results indicate that the choice of the best measurement of word predictability in context critically depends on the processing index being considered."
- title: "Data-driven Cross-lingual Syntax: An Agreement Study with Massively Multilingual Models"
  authors: "Andrea Gregor de Varda, Marco Marelli"
  venue: "Computational Linguistics, 49(2), 261-299"
  year: 2023
  date: "2023-06"
  type: "journal"
  url: "https://doi.org/10.1162/coli_a_00472"
  pdf: "https://aclanthology.org/2023.cl-2.1.pdf"
  abstract: "Massively multilingual models such as mBERT and XLM-R are increasingly valued in Natural Language Processing research and applications, due to their ability to tackle the uneven distribution of resources available for different languages. The models' ability to process multiple languages relying on a shared set of parameters raises the question of whether the grammatical knowledge they extracted during pre-training can be considered as a data-driven cross-lingual grammar. The present work studies the inner workings of mBERT and XLM-R in order to test the cross-lingual consistency of the individual neural units that respond to a precise syntactic phenomenon, that is, number agreement, in five languages (English, German, French, Hebrew, Russian). We found that there is a significant overlap in the latent dimensions that encode agreement across the languages we considered. This overlap is larger (a) for long- vis-à-vis short-distance agreement and (b) when considering XLM-R as compared to mBERT, and peaks in the intermediate layers of the network. We further show that a small set of syntax-sensitive neurons can capture agreement violations across languages; however, their contribution is not decisive in agreement processing."
- title: "A Cross-Modal and Cross-lingual Study of Iconicity in Language: Insights From Deep Learning"
  authors: "Andrea Gregor de Varda, Carlo Strapparava"
  venue: "Cognitive Science, 46(6), e13147"
  year: 2022
  date: "2022-06"
  type: "journal"
  highlight: true
  thumb: "/assets/img/research/multilingual.jpg"
  url: "https://doi.org/10.1111/cogs.13147"
  pdf: "https://onlinelibrary.wiley.com/doi/pdf/10.1111/cogs.13147"
  abstract: "The present paper addresses the study of non-arbitrariness in language within a deep learning framework. We present a set of experiments aimed at assessing the pervasiveness of different forms of non-arbitrary phonological patterns across a set of typologically distant languages. Different sequence-processing neural networks are trained in a set of languages to associate the phonetic vectorization of a set of words to their sensory (Experiment 1), semantic (Experiment 2), and word-class representations (Experiment 3). The models are then tested, without further training, in a set of novel instances in a language belonging to a different language family, and their performance is compared with a randomized baseline. We show that the three cross-domain mappings can be successfully transferred across languages and language families, suggesting that the phonological structure of the lexicon is pervaded with language-invariant cues about the words' meaning and their syntactic classes."
- title: "Different types of syntactic agreement recruit the same units within large language models"
  authors: "Daria Kryvosheieva, Andrea Gregor de Varda, Evelina Fedorenko, Greta Tuckute"
  venue: "ACL 2026 (Long Papers), 209-227"
  year: 2026
  date: "2026-07"
  type: "conference"
  url: "https://aclanthology.org/2026.acl-long.7/"
  pdf: "https://aclanthology.org/2026.acl-long.7.pdf"
  abstract: "Large language models (LLMs) can reliably distinguish grammatical from ungrammatical sentences, but how grammatical knowledge is represented within the model remains an open question. We investigate whether different syntactic phenomena recruit shared or distinct components in LLMs. Using a functional localization approach inspired by cognitive neuroscience, we identify the LLM units most responsive to 67 English syntactic phenomena in seven open-weight models. These units are consistently recruited across sentence instances and causally support model performance. Critically, different types of syntactic agreement (e.g., subject-verb, anaphor, determiner-noun) recruit overlapping sets of units, suggesting that agreement constitutes a meaningful functional category in LLMs. This pattern holds in Russian and Chinese, and further, across languages: in a cross-lingual analysis of 57 languages, syntactically similar languages share more units for subject-verb agreement. Taken together, these findings reveal that syntactic agreement—a critical marker of syntactic dependencies—constitutes a meaningful category within LLMs' representational spaces."
- title: "Locally Biased Transformers Better Align with Human Reading Times"
  authors: "Andrea Gregor de Varda, Marco Marelli"
  venue: "Workshop on Cognitive Modeling and Computational Linguistics (CMCL 2024), 30-36"
  year: 2024
  date: "2024-08"
  type: "conference"
  url: "https://aclanthology.org/2024.cmcl-1.3/"
  pdf: "https://aclanthology.org/2024.cmcl-1.3.pdf"
  abstract: "Recent psycholinguistic theories emphasize the interdependence between linguistic expectations and memory limitations in human language processing. We modify the self-attention mechanism of a transformer model to simulate a lossy context representation, biasing the model's predictions to give additional weight to the local linguistic context. We show that surprisal estimates from our locally-biased model generally provide a better fit to human psychometric data, underscoring the sensitivity of the human parser to local linguistic information."
- title: "The Emergence of Semantic Units in Massively Multilingual Models"
  authors: "Andrea Gregor de Varda, Marco Marelli"
  venue: "LREC-COLING 2024, 15910-15921"
  year: 2024
  date: "2024-05"
  type: "conference"
  url: "https://aclanthology.org/2024.lrec-main.1382/"
  pdf: "https://aclanthology.org/2024.lrec-main.1382.pdf"
  abstract: "Massively multilingual models can process text in several languages relying on a shared set of parameters; however, little is known about the encoding of multilingual information in single network units. In this work, we study how two semantic variables, namely valence and arousal, are processed in the latent dimensions of mBERT and XLM-R across 13 languages. We report a significant cross-lingual overlap in the individual neurons processing affective information, which is more pronounced when considering XLM-R vis-à-vis mBERT. Furthermore, we uncover a positive relationship between cross-lingual alignment and performance, where the languages that rely more heavily on a shared cross-lingual neural substrate achieve higher performance scores in semantic encoding."
- title: "Scaling in Cognitive Modelling: a Multilingual Approach to Human Reading Times"
  authors: "Andrea Gregor de Varda, Marco Marelli"
  venue: "ACL 2023 (Short Papers), 139-149"
  year: 2023
  date: "2023-07"
  type: "conference"
  award: "Outstanding Paper Award, ACL 2023"
  url: "https://aclanthology.org/2023.acl-short.14/"
  pdf: "https://aclanthology.org/2023.acl-short.14.pdf"
  abstract: "Neural language models are increasingly valued in computational psycholinguistics, due to their ability to provide conditional probability distributions over the lexicon that are predictive of human processing times. Given the vast array of available models, it is of both theoretical and methodological importance to assess what features of a model influence its psychometric quality. In this work we focus on parameter size, showing that larger Transformer-based language models generate probabilistic estimates that are less predictive of early eye-tracking measurements reflecting lexical access and early semantic integration. However, relatively bigger models show an advantage in capturing late eye-tracking measurements that reflect the full semantic and syntactic integration of a word into the current language context. Our results are supported by eye movement data in ten languages and consider four models, spanning from 564M to 4.5B parameters."
- title: "The Effects of Surprisal across Languages: Results from Native and Non-native Reading"
  authors: "Andrea Gregor de Varda, Marco Marelli"
  venue: "Findings of the ACL: AACL-IJCNLP 2022, 138-144"
  year: 2022
  date: "2022-11"
  type: "conference"
  url: "https://aclanthology.org/2022.findings-aacl.13/"
  pdf: "https://aclanthology.org/2022.findings-aacl.13.pdf"
  abstract: "It is well known that the surprisal of an upcoming word, as estimated by language models, is a solid predictor of reading times (Smith and Levy, 2013). However, most of the studies that support this view are based on English and few other Germanic languages, leaving an open question as to the cross-lingual generalizability of such findings. Moreover, they tend to consider only the best-performing eye-tracking measure, which might conflate the effects of predictive and integrative processing. Furthermore, it is not clear whether prediction plays a role in non-native language processing in bilingual individuals (Grüter et al., 2014). We approach these problems at large scale, extracting surprisal estimates from mBERT, and assessing their psychometric predictive power on the MECO corpus, a cross-linguistic dataset of eye movement behavior in reading (Siegelman et al., 2022; Kuperman et al., 2020). We show that surprisal is a strong predictor of reading times across languages and fixation measurements, and that its effects in L2 are weaker with respect to L1."
- title: "Multilingualism Encourages Recursion: a Transfer Study with mBERT"
  authors: "Andrea Gregor de Varda, Roberto Zamparelli"
  venue: "Workshop on Computational Typology and Multilingual NLP (SIGTYP), NAACL 2022"
  year: 2022
  date: "2022-07"
  type: "conference"
  url: "https://aclanthology.org/2022.sigtyp-1.1/"
  pdf: "https://aclanthology.org/2022.sigtyp-1.1.pdf"
  abstract: "The present work constitutes an attempt to investigate the relational structures learnt by mBERT, a multilingual transformer-based network, with respect to different cross-linguistic regularities proposed in the fields of theoretical and quantitative linguistics. We pursued this objective by relying on a zero-shot transfer experiment, evaluating the model's ability to generalize its native task to artificial languages that could either respect or violate some proposed language universal, and comparing its performance to the output of BERT, a monolingual model with an identical configuration. We created four artificial corpora through a Probabilistic Context-Free Grammar by manipulating the distribution of tokens and the structure of their dependency relations. We showed that while both models were favoured by a Zipfian distribution of the tokens and by the presence of head-dependency type structures, the multilingual transformer network exhibited a stronger reliance on hierarchical cues compared to its monolingual counterpart."
- title: "Phonovisual Biases in Language: Is the Lexicon Tied to the Visual World?"
  authors: "Andrea Gregor de Varda, Carlo Strapparava"
  venue: "IJCAI 2021, 643-649"
  year: 2021
  date: "2021-08"
  type: "conference"
  url: "https://www.ijcai.org/proceedings/2021/89"
  pdf: "https://www.ijcai.org/proceedings/2021/0089.pdf"
  abstract: "The present paper addresses the study of cross-linguistic and cross-modal iconicity within a deep learning framework. An LSTM-based Recurrent Neural Network is trained to associate the phonetic representation of a concrete word, encoded as a sequence of feature vectors, to the visual representation of its referent, expressed as an HCNN-transformed image. The processing network is then tested, without further training, in a language that does not appear in the training set and belongs to a different language family. The performance of the model is evaluated through a comparison with a randomized baseline; we show that such an imaginative network is capable of extracting language-independent generalizations in the mapping from linguistic sounds to visual features, providing empirical support for the hypothesis of a universal sound-symbolic substrate underlying all languages."
- title: "A Layered Bridge from Sound to Meaning: Investigating Cross-linguistic Phonosemantic Correspondences"
  authors: "Andrea Gregor de Varda, Carlo Strapparava"
  venue: "CogSci 2021"
  year: 2021
  date: "2021-07"
  type: "conference"
  url: "https://escholarship.org/uc/item/30n278w5"
  pdf: "https://escholarship.org/content/qt30n278w5/qt30n278w5.pdf"
  abstract: "The present paper addresses the study of cross-linguistic phonosemantic correspondences within a deep learning framework. An LSTM-based Recurrent Neural Network is trained to associate the phonetic representation of a word, encoded as a sequence of feature vectors, to its corresponding semantic representation in a multilingual and cross-family vector space. The processing network is then tested, without further training, in a language that does not appear in the training set and belongs to a different language family. The performance of the model is evaluated through a comparison with a monolingual and mono-family upper bound and a randomized baseline. After the assessment of the network's performance, the distribution of phonosemantic properties in the lexicon is inspected in relation to different (psycho)linguistic variables, showing a link between lexical non-arbitrariness and semantic, syntactic, pragmatic, and developmental factors."
- title: "Phonological Layers of Meaning: A Computational Exploration of Sound Iconicity"
  authors: "Andrea Gregor de Varda, Carlo Strapparava"
  venue: "CLiC-it 2020 (CEUR Vol. 2769)"
  year: 2020
  date: "2020-12"
  type: "conference"
  award: "Best paper nomination, CLiC-it 2020"
  url: "https://ceur-ws.org/Vol-2769/paper_25.pdf"
  pdf: "https://ceur-ws.org/Vol-2769/paper_25.pdf"
  abstract: "The present paper aims to investigate the nature and the extent of cross-linguistic phonosemantic correspondences within a computational framework. An LSTM-based Recurrent Neural Network is trained to associate the phonetic representation of a word, encoded as a sequence of feature vectors, to its corresponding semantic representation in a multilingual vector space. The processing network is tested, without further training, in a language that does not appear in the training set. The performance of the multilingual model is compared with a monolingual upper bound and a randomized baseline. After the quantitative evaluation of its performance, a qualitative analysis is carried out on the network's most effective predictions, showing an inhomogeneous distribution of phonosemantic information in the lexicon, influenced by semantic, syntactic, and pragmatic factors."
