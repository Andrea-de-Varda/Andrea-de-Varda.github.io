- title: "CogGym: Towards Large-Scale Comparative Evaluation of Human and Machine Cognition"
  authors: "Lance Ying, Jinzhou Wu, Yingshan Susan Wang, Shivam Aarya, Luca M. Schulze Buschoff, Harry Chen, Katherine M. Collins, Andrea Gregor de Varda, … Thomas L. Griffiths, Tobias Gerstenberg, Kevin Smith, Joshua B. Tenenbaum (56 authors)"
  venue: "arXiv:2609.21259"
  year: 2026
  date: "2026-09"
  type: "preprint"
  project: "https://coggym.org"
  url: "https://arxiv.org/abs/2609.21259"
  pdf: "https://arxiv.org/pdf/2609.21259"
  abstract: "Understanding and modeling human intelligence are parallel goals shared by artificial intelligence (AI) and cognitive science. As AI systems grow increasingly capable, in what ways do model responses resemble human responses, and where do they systematically diverge? The sheer breadth and diversity of the tasks humans can perform and think about pose a challenge for scalable and rigorous comparison between humans and models. We introduce CogGym, a scalable, unified framework grounded in cognitive science for systematically comparing model and human behavior on matched experimental trials. CogGym uses a semi-automated, human-in-the-loop pipeline to standardize diverse experimental paradigms into a task-agnostic Experiment Markup Language (EML), enabling reproducible and faithful comparison at scale. For initial release, we curate and standardize 258 cognitive experiments from 100 papers that focuses on human commonsense reasoning, and evaluate 50 large language models against human responses. We find a clear scaling trend where larger and more recent AI models better reproduce human judgments. Yet AI models' improvement on such common reasoning tasks is considerably slower than the gains observed on formal-reasoning benchmarks like math and coding, and model–human fit remains well below human splithalf reliability (R² = 0.93 on text, 0.95 on image, and 0.92 on video) with the best models achieving R² = 0.59 on text, 0.58 on image, and 0.43 on video experiments. We intend for CogGym to provide a living evaluation framework that continually incorporates new cognitive science experiments to characterize where model behavior resembles human behavior, where it systematically diverges, and how those patterns change as models and experiments evolve."
- title: "Shared circuits predict whether LLMs generalize across formats in arithmetic reasoning"
  authors: "Andrea Gregor de Varda, Sana Pandey, Pengrui Han, Jacob Andreas, Evelina Fedorenko"
  venue: "arXiv:2609.04463"
  year: 2026
  date: "2026-09"
  type: "preprint"
  url: "https://arxiv.org/abs/2609.04463"
  pdf: "https://arxiv.org/pdf/2609.04463"
  abstract: "In many forms of reasoning, including arithmetic reasoning, generalizing across superficial changes in input format is effortless for humans: anyone who can solve 2+5 can also solve 'two plus five'. In contrast, LLMs are more brittle to surface variations of the prompts: for example, they solve numeric arithmetic problems almost perfectly but are substantially less accurate on verbal renditions of the same problems. Here, we ask whether generalization across formats can be predicted from the models' internals. Using attribution patching, we first independently localize the circuit that each model recruits to solve numeric arithmetic problems (2+5) vs. verbal ones, in three languages: English ('two plus five'), Spanish ('dos más cinco'), and Italian ('due più cinque'); then, we test whether overlap with the model's own numeric circuit predicts its generalization to the verbal formats. Indeed, we find support for this idea at three levels: circuit overlap accounts for the relative difficulty of the three verbal formats, for which models generalize best, and for which items are solved correctly, rivaling supervised probes while requiring no labeled data."
- title: "Last Translation Benchmark"
  authors: "Vilém Zouhar, Niyati Bafna, Mukund Choudhary, … Andrea Gregor de Varda, … Juri Opitz (260 authors)"
  venue: "arXiv:2609.04173"
  year: 2026
  date: "2026-09"
  type: "preprint"
  url: "https://arxiv.org/abs/2609.04173"
  pdf: "https://arxiv.org/pdf/2609.04173"
  abstract: "For scientific progress, we need benchmarks that test the limits of state-of-the-art models, and evaluation methods that inform us about failure cases. As models get stronger, standard benchmarks for machine translation are approaching saturation. Further, automatic translation metrics are unreliable, opaque, and vulnerable to reward-hacking. Even gold human evaluation is not problem-free, because it often lacks reproducibility, objectivity, and scalability. Overall, this prevents us from tracking progress in the field and identifying pathways for improvement. We introduce the Last Translation Benchmark, a collection of human-authored and peer-reviewed examples (texts, images, audio, videos) that break leading machine translation models. We also present a new evaluation approach: each example comes with handcrafted verification rules describing concrete failure cases on that example, therefore allowing reliable and actionable future evaluation. The Last Translation Benchmark is a live dataset that accepts ongoing contributions. The latest version is LTBv1, containing accepted contributions prior to September 1st 2026, with future releases planned as new data is continuously collected."
- title: "Modular Cognitive Architecture Emerges in Large Language Models"
  authors: "Pengrui Han, Jacob Andreas, Evelina Fedorenko, Andrea Gregor de Varda"
  venue: "arXiv:2608.13567"
  year: 2026
  date: "2026-08"
  type: "preprint"
  highlight: true
  thumb: "/assets/img/research/modularity.png"
  project: "https://pengrui-han.github.io/LLM_Modularity_Page/"
  url: "https://arxiv.org/abs/2608.13567"
  pdf: "https://arxiv.org/pdf/2608.13567"
  abstract: "The human brain exhibits a striking degree of functional specialization, with distinct networks supporting language, formal reasoning, reasoning about other minds, and reasoning about the physical world. Is this modular organization a fundamental principle of how intelligent systems must be built, or an evolutionary accident specific to biological brains? Here, we test whether a similar organization emerges in Large Language Models—another class of intelligent systems created through a very different optimization process. Using circuit analyses across N=46 tasks spanning four cognitive domains (language, formal reasoning, social reasoning, physical reasoning), we find that LLMs develop a modular architecture that mirrors the human brain: tasks drawing on the same network in humans recruit overlapping neurons in LLMs, whereas tasks drawing on different networks recruit distinct neurons. The convergent emergence of modularity in brains and neural networks suggests that it may be a fundamental property of intelligent systems."
- title: "Behavioral and brain responses to language reflect different levels of linguistic representation"
  authors: "Andrea Gregor de Varda, Yevgeni Berzak, Evelina Fedorenko, Roger Levy"
  venue: "bioRxiv"
  year: 2026
  date: "2026-08"
  type: "preprint"
  highlight: true
  thumb: "/assets/img/research/brain_behavior.png"
  note: "Under review"
  url: "https://www.biorxiv.org/content/10.64898/2026.08.21.746238v1"
  pdf: "https://www.biorxiv.org/content/10.64898/2026.08.21.746238v1.full.pdf"
  abstract: "Human language processing can be studied through both behavior and brain activity, yet it remains unclear whether these two data types reflect sensitivity to the same information. One influential view holds that both behavioral and neural responses are largely determined by processing effort, often estimated by word surprisal together with the context-independent properties of word frequency and length. At the same time, neural responses have been shown to encode richer aspects of linguistic content, including meaning. Here, we use neural network language models to operationalize these alternatives and systematically compare, within the same analytic computational framework, the predictive power of low-dimensional effort-based predictors and high-dimensional embedding representations that encode contextualized linguistic content, including meaning. Across 8 behavioral datasets and 5 neural datasets (4 fMRI and 1 ERP), we find that processing effort captures substantial variance in both behavioral and neural measures of language processing, in line with much previous work. However, for brain responses—but not for behavioral measures—embedding representations carry substantial predictive power beyond the estimates of processing effort. These results therefore suggest that neural data provide access to rich, high-dimensional dynamics of language comprehension, whereas behavioral data reflect a bottlenecking of these dynamics into a small set of theoretically motivated properties of contextualized linguistic input."
- title: "Investigating Knowledge Transfer Across Interactive Dialogue Games"
  authors: "Filippo Momentè, Mir Nafis Sharear Shopnil, Andrea Gregor de Varda, Pavel Merinov, Raffaella Bernardi, Oswald Lanz, Alessandro Suglia, Alessandro Torcinovich"
  venue: "arXiv:2608.23969"
  year: 2026
  date: "2026-08"
  type: "preprint"
  url: "https://arxiv.org/abs/2608.23969"
  pdf: "https://arxiv.org/pdf/2608.23969"
  abstract: "Dialogue games represent a challenging setting where complex cognitive skills are required to accomplish tasks while coordinating with other players. Considering that language represents an interface for both understanding the game rules and executing actions, it is reasonable to assume that training on a specific language game will enhance specific capabilities that might be relevant for other tasks as well. Motivated by this rationale, in this paper, we investigate how knowledge transfers across different dialogue games. We study transferability by finetuning LLM models on games from the clembench suite (Chalamalasetti et al., 2023) and performing two analyses: i) we derive a task-transferability graph using a binary integer optimization program from Zamir et al. (2018), using task performance as the main metric; and ii) we compute task vectors (Ilharco et al., 2022) for each game to study similarities across finetuned models and their task transferability. In our first analysis, we find that some games benefit more from transfer than finetuning, and that the visuospatial family (e.g., exploration games) transfers best. With our task vector analysis instead, we find that similarity-based approaches capture game-role relationships but almost no transferability patterns, suggesting that more complex metrics are required."
- title: "Multilingual computational models capture a shared meaning component in brain responses across 21 languages"
  authors: "Andrea Gregor de Varda, Saima Malik-Moraleda, Greta Tuckute, Evelina Fedorenko"
  venue: "bioRxiv"
  year: 2025
  date: "2025-02"
  type: "preprint"
  highlight: true
  thumb: "/assets/img/research/brain.png"
  note: "Under review"
  url: "https://www.biorxiv.org/content/10.1101/2025.02.01.636044v3"
  pdf: "https://www.biorxiv.org/content/10.1101/2025.02.01.636044v3.full.pdf"
  abstract: "At the heart of language neuroscience lies a fundamental question: How does the brain process the rich variety of languages? Multilingual neural network models offer a way to answer this question by representing linguistic content across languages in a shared space. Leveraging these advances, we evaluated the similarity of linguistic representations in speakers of 21 languages. We combined existing (12 languages across 4 language families) and newly collected fMRI data (9 languages across 4 families) to test encoding models predicting brain activity in the language network using representations from multilingual models. Model representations reliably predicted brain responses within each language. Critically, encoding models can be transferred zero-shot across languages, so that a model trained to predict brain activity in a set of languages can account for responses in a held-out language. These results imply a shared cross-lingual component, which appears to be related to a shared meaning space."
- title: "AI-assisted teams outperform AI-led teams but not human-only teams in assessing research reproducibility in quantitative social science"
  authors: "Abel Brodeur, David Valenta, Alexandru Marcoci, … Andrea Gregor de Varda, … (272 authors)"
  venue: "Proceedings of the National Academy of Sciences, 123(22), e2524747123"
  year: 2026
  date: "2026-05"
  type: "journal"
  url: "https://www.pnas.org/doi/10.1073/pnas.2524747123"
  pdf: "https://eprints.whiterose.ac.uk/id/eprint/241548/1/brodeur-et-al-2026-ai-assisted-teams-outperform-ai-led-teams-but-not-human-only-teams-in-assessing-research-1.pdf"
  abstract: "Large Language Models (LLMs) such as ChatGPT are transforming how scientists conduct and validate research, offering promise as tools to improve scientific reproducibility. However, computational reproducibility and error detection remain expensive and labor-intensive. We experimentally test how collaboration between researchers and LLM assistants influences the reproduction of quantitative social science findings across different levels of AI autonomy. We randomly assigned 288 researchers to 103 teams working under three conditions: human-only, AI-assisted (using ChatGPT as a collaborative tool), or AI-led (ChatGPT operating with minimal human oversight). Teams reproduced published results from leading social science journals, detected coding errors, and proposed robustness checks. Human-only and AI-assisted teams achieved comparable reproduction rates (94% vs. 91%) and performed similarly on most outcomes, except human-only teams identified significantly more major coding errors. Both substantially outperformed AI-led teams, which achieved only a 37% reproduction rate, detected fewer errors across all categories, proposed weaker robustness checks, and required more time. This autonomous approach, however, likely represents only a lower bound of AI capabilities. Despite rapid model advances, expert human judgment currently remains indispensable for reliable empirical verification. While AI assistance did not degrade most outcomes, it provided no measurable advantages and was associated with reduced detection of major errors. However, the 37% autonomous reproduction rate indicates that AI could provide value in settings where scale or cost constraints preclude human review of papers, even though general-purpose LLMs offer no immediate advantages for human-supervised verification."
