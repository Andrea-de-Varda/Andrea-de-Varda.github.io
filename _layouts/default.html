<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0f172a">

  <!-- Icons -->
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

  <!-- Social preview (Open Graph / Twitter) -->
  <meta property="og:type" content="{% if page.url == '/' %}profile{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ '/assets/img/og.jpg' | relative_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">
  <meta property="og:image:alt" content="Portrait of Andrea de Varda">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@devarda_a">
  <meta name="twitter:creator" content="@devarda_a">
  <meta name="twitter:title" content="{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.url }}{{ '/assets/img/og.jpg' | relative_url }}">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <!-- Canonical URL -->
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}"/>

  <!-- Person schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Andrea Gregor de Varda",
    "alternateName": "Andrea de Varda",
    "jobTitle": "Postdoctoral Fellow",
    "image": "{{ site.url }}{{ '/assets/img/profile.jpg' | relative_url }}",
    "affiliation": [{
      "@type": "Organization",
      "name": "Massachusetts Institute of Technology (MIT)"
    }],
    "alumniOf": [
      {"@type": "CollegeOrUniversity", "name": "University of Milano-Bicocca"},
      {"@type": "CollegeOrUniversity", "name": "University of Trento"}
    ],
    "url": "{{ site.url }}/",
    "sameAs": [
      "https://scholar.google.com/citations?user=Iwm9mC0AAAAJ&hl=en",
      "https://github.com/Andrea-de-Varda",
      "https://x.com/devarda_a",
      "https://bsky.app/profile/andreadevarda.bsky.social",
      "https://evlab.mit.edu/"
    ]
  }
  </script>
  <meta name="google-site-verification" content="wY82saR8Vw1GN2Dvmug0KjS2q5vi_OT3pacj6ulCWjg" />
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="container nav">
      <div class="brand"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
      <nav class="menu" aria-label="Main">
        <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ '/research/' | relative_url }}" class="{% if page.url contains '/research/' %}active{% endif %}">Research</a>
        <a href="{{ '/publications/' | relative_url }}" class="{% if page.url contains '/publications/' %}active{% endif %}">Publications</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    {{ content }}
  </main>

  <footer>
    <div class="container foot">
      <span>© {{ site.time | date: '%Y' }} Andrea de Varda · Last updated {{ site.time | date: '%b %e, %Y' }}</span>
      <span class="foot-links">
        <a href="https://scholar.google.com/citations?user=Iwm9mC0AAAAJ&hl=en" target="_blank" rel="noopener">Scholar</a>
        <a href="https://github.com/Andrea-de-Varda" target="_blank" rel="noopener">GitHub</a>
        <a href="https://bsky.app/profile/andreadevarda.bsky.social" target="_blank" rel="noopener">Bluesky</a>
        <a href="https://x.com/devarda_a" target="_blank" rel="noopener">X</a>
      </span>
    </div>
  </footer>
</body>
</html>
